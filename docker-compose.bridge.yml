services:
  nc_litter_bridge:
    # Prefer the published image for stranger installs; override with build for
    # local development. Example: image: ghcr.io/vdroners/nc-litter-bridge:latest
    build: ./bridge
    image: ghcr.io/vdroners/nc-litter-bridge:latest
    container_name: nc_litter_bridge
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      # Must match appinfo/info.xml — rewritten by `make bump-*`.
      BRIDGE_VERSION: "${BRIDGE_VERSION:-0.4.2}"
      # Mock mode returns a canned LR4 state so the app + gates run without a
      # real Whisker account. Set LITTER_MOCK=0 + creds for a live device.
      LITTER_MOCK: "${LITTER_MOCK:-1}"
      # Whisker cloud account (pylitterbot). The app stores these encrypted and
      # the bridge reads them from .env for its own process only. Never commit
      # real values.
      WHISKER_EMAIL: "${WHISKER_EMAIL:-}"
      WHISKER_PASSWORD: "${WHISKER_PASSWORD:-}"
      # Which device on the account to bind (serial/id); blank = first LR4.
      LITTER_DEVICE_ID: "${LITTER_DEVICE_ID:-}"
      # Cloud poll cadence (seconds) when no live push is active.
      LITTER_REFRESH_S: "${LITTER_REFRESH_S:-30}"
    # Image ships python3 but no curl/wget, so probe with urllib.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Observed ~80–120 MiB. Plain `docker compose` ignores Swarm-only
    # `deploy.resources`; these keys are what actually cap the container.
    mem_limit: 512m
    pids_limit: 128
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128
    # Host loopback only for gates/debug — not LAN-public.
    ports:
      - "127.0.0.1:18793:8080"
    networks:
      nc-litter-net:
        aliases:
          - nc_litter_bridge
          - nc-litter-bridge

networks:
  nc-litter-net:
    name: nc-litter-net
